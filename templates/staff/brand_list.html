{% extends "base.html" %}{% block content %}<h1>Brands</h1>
<form method="get"><input name="q" value="{{ q }}" placeholder="name"><input name="from" type="date" value="{{ date_from }}"><input name="until" type="date" value="{{ date_until }}"><button>Filter</button></form>
<form method="post">{% csrf_token %}<select name="bulk"><option value="deleted">Delete</option></select><button>Apply</button>
<ul>{% for r in rows %}<li><input type="checkbox" name="selected_ids" value="{{ r.brand.brand_id }}"> <a href="/admin/brands/{{ r.brand.brand_id }}/">{{ r.brand.identify_name }}</a> {{ r.brand.currency_code }}{% if not r.deleteable %} (protected){% endif %}</li>{% endfor %}</ul></form>
<a href="/admin/brands/create/">Create</a>{% endblock %}
