{% extends "base.html" %}{% block content %}<h1>Customers</h1>
<p><a href="?">All</a> <a href="?tab=manual">Manual</a> <a href="?tab=checkout">Checkout</a></p>
<form method="get"><input name="q" value="{{ q }}"><input name="status" value="{{ status }}"><button>Search</button></form>
<form method="post">{% csrf_token %}<select name="bulk"><option value="activated">Activate</option><option value="suspended">Suspend</option><option value="deleted">Delete</option></select><button>Apply</button>
<ul>{% for c in page %}<li><input type="checkbox" name="selected_ids" value="{{ c.id }}"> {{ c.name }} {{ c.email }} {{ c.mobile }} {{ c.status }} {{ c.inserted_via }}</li>{% endfor %}</ul></form>
<h2>Create</h2><form method="post">{% csrf_token %}
<select name="brand_id">{% for b in brands %}<option value="{{ b.brand_id }}">{{ b.identify_name }}</option>{% endfor %}</select>
<input name="name" placeholder="Name" required> <input name="email" placeholder="Email" required> <input name="mobile" placeholder="Mobile" required>
<select name="status"><option>active</option><option>suspend</option></select> <input name="suspend_reason" placeholder="Suspend reason">
<button>Create</button></form>{% endblock %}
