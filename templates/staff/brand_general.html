{% extends "staff/base_admin.html" %}
{% block title %}General settings — PipraPay Admin{% endblock %}
{% block pretitle %}Brand Settings{% endblock %}
{% block pagetitle %}General settings{% endblock %}
{% block admin_content %}
<div class="card"><div class="card-body"><form method="post" enctype="multipart/form-data">{% csrf_token %}
<div class="pp-form-grid">
<div><label class="form-label">Identify name</label><input name="identify_name" class="form-control" value="{{ brand.identify_name|default:"" }}" placeholder="Identify name"></div>
<div><label class="form-label">Name</label><input name="name" class="form-control" value="{{ brand.name|default:"" }}" placeholder="Name"></div>
<div><label class="form-label">Timezone</label><select name="timezone" class="form-select">{% for tz in timezones %}<option{% if brand.timezone == tz %} selected{% endif %}>{{ tz }}</option>{% endfor %}</select></div>
<div><label class="form-label">Language</label><select name="language" class="form-select"><option value="en">en</option><option value="bn">bn</option><option value="hi">hi</option><option value="ur">ur</option></select></div>
<div><label class="form-label">Currency code</label><input name="currency_code" class="form-control" value="{{ brand.currency_code|default:"" }}"></div>
<div><label class="form-label">Payment tolerance</label><input name="payment_tolerance" class="form-control" value="{{ brand.payment_tolerance|default:"0" }}"></div>
<div><label class="form-label">Auto exchange</label><select name="autoExchange" class="form-select"><option>disabled</option><option{% if brand.autoExchange == "enabled" %} selected{% endif %}>enabled</option></select></div>
<div><label class="form-label">Support email</label><input name="support_email_address" class="form-control" value="{{ brand.support_email_address|default:"" }}" placeholder="support email"></div>
<div><label class="form-label">Support phone</label><input name="support_phone_number" class="form-control" value="{{ brand.support_phone_number|default:"" }}" placeholder="phone"></div>
<div><label class="form-label">Support website</label><input name="support_website" class="form-control" value="{{ brand.support_website|default:"" }}" placeholder="website"></div>
<div><label class="form-label">Whatsapp</label><input name="whatsapp_number" class="form-control" value="{{ brand.whatsapp_number|default:"" }}" placeholder="whatsapp"></div>
<div><label class="form-label">Telegram</label><input name="telegram" class="form-control" value="{{ brand.telegram|default:"" }}" placeholder="telegram"></div>
<div><label class="form-label">Messenger</label><input name="facebook_messenger" class="form-control" value="{{ brand.facebook_messenger|default:"" }}" placeholder="messenger"></div>
<div><label class="form-label">Facebook page</label><input name="facebook_page" class="form-control" value="{{ brand.facebook_page|default:"" }}" placeholder="fb page"></div>
<div><label class="form-label">Street</label><input name="street_address" class="form-control" value="{{ brand.street_address|default:"" }}" placeholder="street"></div>
<div><label class="form-label">City</label><input name="city_town" class="form-control" value="{{ brand.city_town|default:"" }}" placeholder="city"></div>
<div><label class="form-label">Postal code</label><input name="postal_code" class="form-control" value="{{ brand.postal_code|default:"" }}" placeholder="postal"></div>
<div><label class="form-label">Country</label><input name="country" class="form-control" value="{{ brand.country|default:"" }}" placeholder="country"></div>
<div><label class="form-label">Favicon</label><input type="file" name="favicon" class="form-control"></div>
<div><label class="form-label">Logo</label><input type="file" name="logo" class="form-control"></div>
</div>
<div class="mt-3"><button class="btn btn-primary" type="submit">Save</button></div>
</form></div></div>
{% endblock %}
