{% extends "base.html" %}
{% block title %}2FA — PipraPay{% endblock %}
{% block content %}
<div class="pp-auth-wrap"><div class="pp-auth-card">
<div class="text-center mb-3"><img src="/static/vendor/logo-light.png" alt="PipraPay" style="height:40px"></div>
<div class="card"><div class="card-body p-4">
<h2 class="card-title text-center mb-3">Two-factor authentication</h2>
<p class="text-secondary text-center">Enter the 6-digit code from your authenticator app.</p>
<form method="post">{% csrf_token %}
<div id="boxes" class="pp-otp-boxes mb-3">
<input name="code_one" class="form-control" maxlength="1" size="1" required>
<input name="code_two" class="form-control" maxlength="1" size="1" required>
<input name="code_three" class="form-control" maxlength="1" size="1" required>
<input name="code_four" class="form-control" maxlength="1" size="1" required>
<input name="code_five" class="form-control" maxlength="1" size="1" required>
<input name="code_six" class="form-control" maxlength="1" size="1" required>
</div>
<p class="text-center">Or enter the full code: <input name="code" class="form-control d-inline-block" style="width:10rem" placeholder="6-digit code"></p>
<button type="submit" class="btn btn-primary w-100">Verify</button></form>
<p class="text-center mt-3 mb-0"><a href="/login/?logout=1">Logout</a></p>
</div></div>
</div></div>
{% endblock %}
{% block foot %}
<script>
const boxes = [...document.querySelectorAll('#boxes input')];
boxes.forEach((b, i) => b.addEventListener('input', () => { if (b.value && i < 5) boxes[i+1].focus(); }));
boxes.forEach((b, i) => b.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !b.value && i > 0) boxes[i-1].focus(); }));
</script>
{% endblock %}
