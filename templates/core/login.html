{% extends "base.html" %}{% block title %}Login — PipraPay{% endblock %}
{% block content %}<h1>Login</h1>
<form method="post">{% csrf_token %}
<input name="username" placeholder="Username or email" required>
<input name="password" id="password" type="password" placeholder="Password" required>
<button type="button" id="toggle">Show</button>
<button type="submit">Login</button></form>
<p><a href="/forgot/">Forgot password?</a></p>
<script>document.getElementById('toggle').onclick=()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';};</script>{% endblock %}
