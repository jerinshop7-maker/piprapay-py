{% extends "base.html" %}
{% block title %}Login — PipraPay{% endblock %}
{% block content %}
<div class="pp-auth-wrap"><div class="pp-auth-card">
<div class="text-center mb-3"><img src="/static/vendor/logo-light.png" alt="PipraPay" style="height:40px"></div>
<div class="card"><div class="card-body p-4">
<h2 class="card-title text-center mb-3">Login to your account</h2>
<form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">Username or email</label>
<input name="username" class="form-control" placeholder="Username or email" required autofocus></div>
<div class="mb-2"><label class="form-label">Password</label>
<div class="input-group"><input name="password" id="password" type="password" class="form-control" placeholder="Password" required>
<button type="button" class="btn btn-ghost-secondary" id="toggle">Show</button></div></div>
<div class="mb-3 text-end"><a href="/forgot/">Forgot password?</a></div>
<button type="submit" class="btn btn-primary w-100">Login</button></form>
</div></div>
</div></div>
{% endblock %}
{% block foot %}
<script>document.getElementById('toggle').onclick = function(){ var p = document.getElementById('password'); if (p.type === 'password') { p.type = 'text'; this.textContent = 'Hide'; } else { p.type = 'password'; this.textContent = 'Show'; } };</script>
{% endblock %}
